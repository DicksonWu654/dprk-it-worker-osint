name: validate

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Validate data
        run: python tools/validate.py
      - name: Build
        run: python tools/build.py
      - name: Generated files are up to date
        run: |
          # The two JSON exports include a build timestamp; all other output is deterministic.
          git diff --stat -- docs build ':!build/data.json' ':!build/stats.json'
          git diff --quiet -- docs build ':!build/data.json' ':!build/stats.json' || {
            echo "Generated docs, CSVs, or viewer assets are stale. Run 'make build' and commit the result."; exit 1; }
          test -z "$(git ls-files --others --exclude-standard -- docs build)" || {
            echo "Generated files are untracked. Run 'make build' and commit the result."; exit 1; }
